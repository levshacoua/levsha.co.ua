---
layout: null
sitemap: false
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lefty's Laser — web remote (simulator)</title>
<style>
  :root { --bg:#101418; --card:#1a2027; --tx:#e8edf2; --mut:#8b98a5; --acc:#4f8cff; --ok:#31c47e; --warn:#f0a832; --err:#e5534b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:16px/1.45 "Roboto",system-ui,sans-serif; padding:16px; max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 4px; display:flex; align-items:center; gap:10px; }
  h1 .dot { width:12px; height:12px; border-radius:50%; background:var(--ok); }
  .sim-note { font-size:12px; color:var(--mut); margin-bottom:14px; letter-spacing:.04em; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; }
  .state { font-size:15px; color:var(--mut); }
  .state b { color:var(--tx); font-size:17px; }
  .bar { height:10px; background:#0b0e12; border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .5s; }
  .file { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #242c35; }
  .file:last-child { border-bottom:0; }
  .file .nm { flex:1; word-break:break-all; }
  .file .sz { color:var(--mut); font-size:13px; white-space:nowrap; }
  button { border:0; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:600; color:#fff; background:var(--acc); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  button.run { background:var(--ok); }
  button.warn { background:var(--warn); color:#222; }
  button.err { background:var(--err); }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row button { flex:1; }
  .msg { color:var(--mut); font-size:14px; margin-top:8px; min-height:18px; }
</style>
</head>
<body>
<h1><span class="dot"></span>Lefty's Laser <span style="color:var(--mut);font-weight:400;font-size:14px">leftys-laser.local</span></h1>
<div class="sim-note">SIMULATOR — this is the real web remote UI running against a virtual machine</div>

<div class="card">
  <div class="state">State: <b id="state">IDLE</b> <span id="job"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row">
    <button class="warn" id="pause" disabled onclick="doPause()">⏸ Pause</button>
    <button class="run"  id="resume" disabled onclick="doResume()">▶ Resume</button>
    <button class="err"  id="abort" disabled onclick="doStop()">⏹ Stop</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b>Files on SD card</b>
  </div>
  <div id="files"></div>
</div>

<script>
const q = s => document.getElementById(s);
const FILES = [
  { name: 'logo_50mm.gc', size: '412 KB', secs: 46 },
  { name: 'test.nc', size: '23.8 KB', secs: 24 },
  { name: 'coaster_v2.nc', size: '96 KB', secs: 32 }
];
let sim = { state: 'idle', file: null, pct: 0, timer: null, secs: 0 };

function renderFiles() {
  q('files').innerHTML = FILES.map((f, i) =>
    `<div class="file"><span class="nm">${f.name}</span><span class="sz">${f.size}</span>
     <button class="run" ${sim.state !== 'idle' ? 'disabled' : ''} onclick="runFile(${i})">Run</button></div>`).join('');
}

function setButtons() {
  q('pause').disabled  = sim.state !== 'run';
  q('resume').disabled = sim.state !== 'pause';
  q('abort').disabled  = sim.state === 'idle' || sim.state === 'homing';
}

function tick() {
  if (sim.state !== 'run') return;
  sim.pct += 100 / (sim.secs * 2);
  if (sim.pct >= 100) {
    sim.pct = 100;
    finish('Job finished — machine back at work zero.');
    return;
  }
  render();
  sim.timer = setTimeout(tick, 500);
}

function runFile(i) {
  if (sim.state !== 'idle') return;
  sim.file = FILES[i]; sim.secs = FILES[i].secs; sim.pct = 0;
  sim.state = 'homing';
  q('msg').textContent = 'Auto-homing before the job (built into the firmware)…';
  render(); renderFiles();
  setTimeout(() => {
    if (sim.state !== 'homing') return;
    sim.state = 'run';
    q('msg').textContent = 'Streaming from SD — planner buffer full, laser firing.';
    render(); tick();
  }, 2600);
}

function doPause()  { if (sim.state === 'run') { sim.state = 'pause'; clearTimeout(sim.timer); q('msg').textContent = 'Feed hold — laser off, position kept.'; render(); } }
function doResume() { if (sim.state === 'pause') { sim.state = 'run'; q('msg').textContent = 'Resumed.'; render(); tick(); } }
function doStop()   { clearTimeout(sim.timer); finish('Job aborted — safe stop, laser off.'); }

function finish(msg) {
  sim.state = 'idle'; sim.pct = 0; sim.file = null;
  q('msg').textContent = msg;
  render(); renderFiles();
}

function render() {
  const names = { idle: 'IDLE', homing: 'HOMING', run: 'RUNNING', pause: 'PAUSED' };
  q('state').textContent = names[sim.state];
  q('job').textContent = sim.file && sim.state !== 'idle' ? `${sim.file.name} — ${Math.floor(sim.pct)}%` : '';
  q('bar').style.width = (sim.state === 'idle' ? 0 : sim.pct) + '%';
  setButtons();
}

renderFiles(); render();
</script>
</body>
</html>
