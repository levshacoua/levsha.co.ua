<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Lefty design</title>
  {% if page.stealth %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/portfolio.css?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
  <svg id="strings-svg" class="strings" aria-hidden="true" preserveAspectRatio="none"></svg>

  <div class="sgrid">
    <header class="pf-header">
      <a class="logo-link" href="/"><img class="logo" src="/assets/logo.svg" alt="Lefty design"></a>
      <a class="pf-nav-item n1" href="/portfolio/" {% if page.nav == 'portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
      <a class="pf-nav-item n2" href="/cv/" {% if page.nav == 'cv' %}aria-current="page"{% endif %}>About</a>
      <a class="pf-nav-item n3" href="mailto:lefty.ss.design@gmail.com">Contact</a>
    </header>

    {{ content }}

    <footer class="pf-footer">
      <a href="mailto:lefty.ss.design@gmail.com">lefty.ss.design@gmail.com</a> · <a href="https://t.me/Lefty_s_design">@Lefty_s_design</a>
    </footer>
  </div>

  {% include magic-circle.svg %}
  <span class="pf-copyright">Copyright © EST. 2016</span>

  <script>
    // Freeze rest-state widths so the hover tracking change never shifts neighbours.
    document.fonts.ready.then(() => {
      document.querySelectorAll('.pf-nav-item, .pf-filters button').forEach(el => {
        el.style.minWidth = Math.ceil(el.getBoundingClientRect().width) + 'px';
      });
    });
  </script>
  <script src="/assets/strings.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
