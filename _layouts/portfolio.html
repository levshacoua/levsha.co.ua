<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Lefty design</title>
  {% if page.stealth %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/portfolio.css">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
</head>
<body>
  <svg id="strings-svg" class="strings" aria-hidden="true" preserveAspectRatio="none"></svg>

  <div class="shell">
    <header class="pf-header">
      <a href="/"><img class="logo" src="/assets/logo.svg" alt="Lefty design"></a>
      <nav class="pf-nav">
        <a href="/portfolio/" {% if page.nav == 'portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
        <a href="/cv/" {% if page.nav == 'cv' %}aria-current="page"{% endif %}>CV</a>
        <a href="mailto:lefty.ss.design@gmail.com">Contact</a>
      </nav>
    </header>

    {{ content }}

    <footer class="pf-footer">
      <span>© 2016–2026 Lefty design</span>
      <span><a href="mailto:lefty.ss.design@gmail.com">lefty.ss.design@gmail.com</a> · <a href="https://t.me/Lefty_s_design">@Lefty_s_design</a></span>
    </footer>
  </div>
  <script src="/assets/strings.js"></script>
</body>
</html>
